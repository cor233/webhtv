name: Sync Releases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync-all-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步标签
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/fish2018/webhtv.git
          git fetch upstream --prune --tags
          git push --force origin --tags

      - name: 获取上游发布版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/fish2018/webhtv/releases --paginate --jq 'sort_by(.published_at)' > releases.json

      - name: 处理每个发布版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_REPO="${{ github.repository }}"
          jq -c '.[]' releases.json | while IFS= read -r release; do
            TAG=$(echo "$release" | jq -r '.tag_name')
            TITLE=$(echo "$release" | jq -r '.name // .tag_name')
            BODY=$(echo "$release" | jq -r '.body // ""')
            PRE=$(echo "$release" | jq -r '.prerelease')
            DRAFT=$(echo "$release" | jq -r '.draft')

            if gh release view "$TAG" --repo "$TARGET_REPO" &>/dev/null; then
              echo "Release $TAG already exists, skipping"
              continue
            fi

            echo "Creating release: $TAG"
            echo "$BODY" > body.txt
            gh release create "$TAG" \
              --repo "$TARGET_REPO" \
              --title "$TITLE" \
              --notes-file body.txt \
              --target "$TAG" \
              $([ "$PRE" = "true" ] && echo "--prerelease") \
              $([ "$DRAFT" = "true" ] && echo "--draft")

            mkdir -p assets
            gh release download "$TAG" --repo fish2018/webhtv --dir assets || true
            if [ "$(ls -A assets 2>/dev/null)" ]; then
              gh release upload "$TAG" assets/* --repo "$TARGET_REPO" --clobber
            fi
            rm -rf assets body.txt
          done
